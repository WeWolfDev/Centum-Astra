<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alumno · Videoteca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:rgba(255,255,255,0.6)}a:hover{color:rgba(255,255,255,0.92)}
button{font:inherit}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 860px; background: #030a1a; color: #cbd5e1; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; line-height: 1.5">

<nav aria-label="Principal" style="flex: 1 0 232px; box-sizing: border-box; padding: 20px; background: #04091f; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 32px">
<div style="font-family: 'Orbitron', sans-serif; line-height: 1.2; padding: 8px 12px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #ffffff">CENTUM</div>
<div style="font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: #f5c842">ASTRA</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 14px">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg><span>Inicio</span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 7C10 5.5 7 5 4 5.5v12c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-12C17 5 14 5.5 12 7zM12 7v12"></path></svg><span>Módulos</span></a>
<a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #ffffff; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f5c842" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 6h16v12H4zM10 9.5v5l4.5-2.5z"></path></svg><span>Videoteca</span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg><span>Simuladores y quizzes</span></a>
</div>
<div style="margin-top: auto; font-size: 13px; padding: 0 12px">
<div style="color: #e2e8f0; font-weight: 500">Ana García</div>
<a href="#" style="display: inline-block; padding: 12px 0; text-decoration: none">Cerrar sesión</a>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 28px; background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(12,29,69,0.85), rgba(12,29,69,0) 70%)">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1; letter-spacing: -0.03em; color: #ffffff">Videoteca</h1>
<label style="display: flex; align-items: center; gap: 10px; flex: 0 1 320px; min-width: 0; box-sizing: border-box; min-height: 48px; padding: 0 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; background: rgba(12,29,69,0.5)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<input type="search" aria-label="Buscar sesión" placeholder="Buscar tema o profesor" style="flex: 1 1 auto; min-width: 0; height: 44px; border: 0; background: transparent; color: #e2e8f0; font: inherit; font-size: 15px" />
</label>
</header>

<div role="group" aria-label="Filtrar por materia" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 8px 16px; border: 1.5px solid {{c.bd}}; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ic}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.name}}</button>
</sc-for>
</div>

<div style="font-size: 14px; color: #cbd5e1">{{conteo}}</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 28px 24px">
<sc-for list="{{videos}}" as="v" hint-placeholder-count="6">
<a href="#" style="display: block; min-width: 0; color: #cbd5e1; text-decoration: none">
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 16px; background: #0c1d45; overflow: hidden">
<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 4%; top: 8%; height: 84%; width: auto"><path d="{{v.icon}}"></path></svg>
<div style="position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 999px; background: #f5c842; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2.5v11l9-5.5z" fill="#030a1a"></path></svg></div>
<div style="position: absolute; right: 12px; bottom: 12px; padding: 3px 9px; border-radius: 6px; background: rgba(3,10,26,0.85); color: #ffffff; font-size: 13px; font-weight: 600">{{v.dur}}</div>
</div>
<div style="margin-top: 12px; font-size: 17px; font-weight: 600; line-height: 1.3; color: #ffffff">{{v.t}}</div>
<div style="margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px"><span style="font-weight: 600; color: {{v.color}}">{{v.materia}}</span><span>{{v.prof}}</span></div>
</a>
</sc-for>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var sub = [
      { name: 'Pensamiento Matemático', color: '#93c5fd', icon: 'M18 6V4H6l6 8-6 8h12v-2' },
      { name: 'Comprensión Lectora', color: '#d8b4fe', icon: 'M12 7C10 5.5 7 5 4 5.5v12c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-12C17 5 14 5.5 12 7zM12 7v12' },
      { name: 'Redacción Indirecta', color: '#6ee7b7', icon: 'M4 20l1-4L16 5l3 3L8 19l-4 1zM14 7l3 3' },
      { name: 'Pre-medicina', color: '#5eead4', icon: 'M2 12h5l2-6 4 12 2-6h7' },
      { name: 'Ciencias de la Salud', color: '#67e8f9', icon: 'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z' }
    ];
    var all = [
      { t: 'Álgebra lineal: matrices y determinantes', s: 0, prof: 'Mtra. Sofía Ramírez', dur: '1:45:30', vistas: 187 },
      { t: 'Textos argumentativos: estructura y análisis', s: 1, prof: 'Prof. Carlos Mendoza', dur: '1:22:10', vistas: 143 },
      { t: 'Redacción: coherencia y cohesión en el texto', s: 2, prof: 'Mtra. Patricia Luna', dur: '1:35:45', vistas: 112 },
      { t: 'Biología celular: membrana y organelos', s: 3, prof: 'Dr. Ramón Solís', dur: '2:10:00', vistas: 95 },
      { t: 'Probabilidad y estadística inferencial', s: 0, prof: 'Mtra. Sofía Ramírez', dur: '1:55:20', vistas: 201 },
      { t: 'Epidemiología y salud pública', s: 4, prof: 'Dr. Ramón Solís', dur: '1:40:15', vistas: 78 }
    ];
    var fil = (this.state && this.state.fil != null) ? this.state.fil : -1;
    function chip(name, id) {
      var on = fil === id;
      return {
        name: name, on: on, icon: id === -1 ? 'M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z' : sub[id].icon,
        pick: function () { self.setState({ fil: id }); },
        bg: on ? 'rgba(245,200,66,0.1)' : 'rgba(255,255,255,0.04)',
        bd: on ? '#f5c842' : 'rgba(255,255,255,0.13)',
        fg: on ? '#ffffff' : '#cbd5e1', ic: on ? '#f5c842' : '#cbd5e1'
      };
    }
    var chips = [chip('Todas', -1)].concat(sub.map(function (s, i) { return chip(s.name, i); }));
    var videos = all.filter(function (v) { return fil === -1 || v.s === fil; }).map(function (v) {
      return { t: v.t, prof: v.prof, dur: v.dur, vistas: v.vistas, materia: sub[v.s].name, color: sub[v.s].color, icon: sub[v.s].icon };
    });
    var conteo = videos.length + (videos.length === 1 ? ' sesión grabada' : ' sesiones grabadas');
    return { chips: chips, videos: videos, conteo: conteo };
  }
}
</script>
</body>
</html>
