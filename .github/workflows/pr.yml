name: PR Check

on:
  # SonarCloud necesita analizar main para actualizar el panel y comparar los PRs
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial para asignar los cambios del PR
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verificar que el bundle no contenga claves privadas
        run: node scripts/verificar-bundle.mjs dist

      - name: Análisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
